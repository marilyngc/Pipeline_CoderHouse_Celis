apiVersion: v1
kind: ServiceAccount
metadata:
  name: scaler-sa
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaler-role
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaler-rolebinding
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: scaler-sa
    namespace: demo
roleRef:
  kind: Role
  name: scaler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-down-nightly
  namespace: demo
spec:
  schedule: "0 20 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: scaler-sa
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command: ["kubectl", "scale", "deployment/demo-app", "--replicas=0"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-up-morning
  namespace: demo
spec:
  schedule: "0 7 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: scaler-sa
          restartPolicy: Never
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command: ["kubectl", "scale", "deployment/demo-app", "--replicas=1"]
