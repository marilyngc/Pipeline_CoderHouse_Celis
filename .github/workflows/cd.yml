name: CD - Build, Infra, Deploy y DAST

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DEMO_TOKEN }}

      - name: Set image ref
        id: set-image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Pushing image ${IMAGE_NAME}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ${{ steps.set-image.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/docket-test-app:latest

  infra-and-deploy:
    runs-on: ubuntu-latest
    needs: build-image

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Setup kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Terraform fmt
        run: terraform -chdir=terraform/01-infra fmt -check -recursive

      - name: Clean stale Terraform state
        run: |
          rm -f terraform/01-infra/terraform.tfstate
          rm -f terraform/01-infra/terraform.tfstate.backup

      - name: Terraform init
        run: terraform -chdir=terraform/01-infra init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform/01-infra validate

      - name: Terraform apply
        shell: bash
        run: |
          terraform -chdir=terraform/01-infra apply -auto-approve
          export KUBECONFIG=$(terraform -chdir=terraform/01-infra output -raw kubeconfig_path)
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          kubectl cluster-info
          kubectl get nodes

      - name: Create demo namespace
        run: |
          kubectl apply -f k8s/00-namespace.yaml

      - name: Create GHCR pull secret
        shell: bash
        run: |
          kubectl create secret docker-registry ghcr-creds \
            --namespace demo \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.DEMO_TOKEN }}" \
            --docker-email="${{ github.actor }}@users.noreply.github.com" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-deployment.yaml
          kubectl apply -f k8s/02-service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl set image deployment/demo-app -n demo demo-app=${{ needs.build-image.outputs.image }}
          kubectl rollout status deployment/demo-app -n demo --timeout=180s

      - name: Smoke test app
        run: |
          kubectl port-forward -n demo svc/demo-app 3000:80 >/tmp/demo-portforward.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:3000/health && break
            sleep 2
          done

      - name: Run DAST scan with OWASP ZAP
        run: |
          docker run --rm -v "$PWD":/zap/wrk/:rw \
            -t owasp/zap2docker-stable:latest \
            zap-baseline.py -t http://127.0.0.1:3000 -r zap-report.html || true

      - name: Show DAST report presence
        run: |
          ls -l zap-report.html
