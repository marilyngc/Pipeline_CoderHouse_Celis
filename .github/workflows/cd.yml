name: Validar infraestructura y manifiestos

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configurar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Inicializar Terraform
        run: terraform -chdir=terraform/01-infra init -backend=false

      - name: Validar Terraform
        run: terraform -chdir=terraform/01-infra validate

      - name: Revisar formato de Terraform
        run: terraform -chdir=terraform/01-infra fmt -check -recursive

      - name: Validar manifiestos de Kubernetes
        run: |
          kubectl apply --dry-run=client -f k8s/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/01-deployment.yaml
          kubectl apply --dry-run=client -f k8s/02-service.yaml
          kubectl apply --dry-run=client -f k8s/ingress.yaml
          kubectl apply --dry-run=client -f k8s/hpa.yaml

      - name: Resumen
        run: |
          echo "Terraform y los manifiestos de Kubernetes se validaron correctamente."
          echo "Este workflow no genera imágenes Docker ni levanta contenedores."
