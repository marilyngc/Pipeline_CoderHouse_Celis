name: Validar infraestructura y manifiestos

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configurar kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Inicializar Terraform
        run: terraform -chdir=terraform/01-infra init -backend=false

      - name: Validar Terraform
        run: terraform -chdir=terraform/01-infra validate

      - name: Revisar formato de Terraform
        run: terraform -chdir=terraform/01-infra fmt -check -recursive

      - name: Validar manifiestos de Kubernetes
        run: |
          python3 - <<'PY'
          import yaml
          from pathlib import Path

          files = [
              Path('k8s/00-namespace.yaml'),
              Path('k8s/01-deployment.yaml'),
              Path('k8s/02-service.yaml'),
              Path('k8s/ingress.yaml'),
              Path('k8s/hpa.yaml'),
          ]

          for file in files:
              with file.open('r', encoding='utf-8') as fh:
                  list(yaml.safe_load_all(fh))

          print('Los manifiestos de Kubernetes tienen sintaxis YAML válida.')
          PY

      - name: Resumen
        run: |
          echo "Terraform y los manifiestos de Kubernetes se validaron correctamente."
          echo "Este workflow no genera imágenes Docker ni levanta contenedores."
