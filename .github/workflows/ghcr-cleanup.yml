name: Limpieza de imagenes GHCR

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Borrar versiones antiguas del paquete
        uses: actions/delete-package-versions@v5
        with:
          package-name: "docket-test-app"
          package-type: "container"
          min-versions-to-keep: 5
